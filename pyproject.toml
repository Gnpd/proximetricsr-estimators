[project]
name = "proximetricsr-estimators"
version = "0.1.0"
description = "sklearn-compatible estimators used to reconstruct proximetricsR (BUCHI NIRWise-PLUS-compatible) models in Python, e.g. via openmodels."
authors = [{ name = "Alejandro Gutiérrez", email = "a.gutierrez@g-npd.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2.0.0,<3",
    "scikit-learn>=1.6.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "openmodels",
    "chemotools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = "always"
